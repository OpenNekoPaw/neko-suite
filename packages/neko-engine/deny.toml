[advisories]
ignore = [
    # json crate — unmaintained, transitive dep from inox2d (2D puppet library)
    "RUSTSEC-2022-0081",
    # number_prefix — unmaintained, transitive dep from indicatif (progress bars)
    "RUSTSEC-2025-0119",
    # paste — unmaintained, no replacement available yet
    "RUSTSEC-2024-0436",
]

[sources]
# Allow inox2d git dependency (no crates.io release available)
allow-git = ["https://github.com/Inochi2D/inox2d"]

[bans]
# base64 v0.13 (gltf) + v0.22 (ours) — transitive, can't unify
skip = [
    { crate = "base64@0.13.1" },
]
