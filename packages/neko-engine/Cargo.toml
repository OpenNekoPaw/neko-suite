[workspace]
resolver = "2"
members = [
    "packages/types",
    "packages/native-core",
    "packages/native-api",
    "packages/native-http",
    "packages/native-napi",
    "packages/native-cli",
    "packages/native-scene",
    "packages/native-puppet",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
# GPU - wgpu for cross-platform GPU compute
wgpu = { version = "0.19", features = ["metal"] }
wgpu-hal = { version = "0.19", features = ["metal"] }
wgpu-core = { version = "0.19" }
pollster = "0.3"

# FFmpeg bindings
ffmpeg-next = "8.0"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "fs", "signal"] }

# HTTP/WebSocket server
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1.5"
async-stream = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# System monitoring
sysinfo = "0.30"

# UUID generation
uuid = { version = "1.6", features = ["v4"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-tracy = { version = "0.11", default-features = false, features = ["enable"] }
tracy-client = { version = "0.17", default-features = false }

# 3D scene ECS
bevy_ecs = "0.15"
glam = { version = "0.29", features = ["serde"] }
gltf = { version = "1.4", features = ["KHR_lights_punctual"] }

# Utilities
bytemuck = { version = "1.14", features = ["derive"] }
crossbeam-channel = "0.5"
indicatif = "0.17"

# ZIP archive reading (EPUB extraction)
zip = "2"

# Base64 encoding
base64 = "0.22"

# Image encoding - pure Rust JPEG encoder
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# ML inference - ONNX Runtime (dynamic linking)
ort = { version = "2.0.0-rc.12", features = ["load-dynamic", "ndarray"] }
ndarray = "0.17"
rustfft = "6"

# Text rendering - font shaping, layout, rasterization
cosmic-text = "0.12"

# Loudness measurement - ITU-R BS.1770-4
ebur128 = "0.1"

[profile.release]
lto = true
opt-level = 3

[profile.dev]
opt-level = 1
