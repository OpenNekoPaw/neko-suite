[package]
name = "neko-native-scene"
version.workspace = true
edition.workspace = true
description = "3D scene management with ECS for Neko Engine"
license.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
# ECS framework (standalone, not full Bevy)
bevy_ecs = "0.15"

# Math library
glam = { version = "0.29", features = ["serde"] }

# glTF parsing
gltf = { version = "1.4", features = ["KHR_lights_punctual"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Error handling
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"
