[package]
name = "neko-native-api"
version.workspace = true
edition.workspace = true
description = "Controller layer for Neko Engine - ActionRouter, Controllers, and Registries"
license.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
# Shared types
neko-types = { path = "../types" }

# Core services
neko-native-core = { path = "../native-core", features = [] }

# Async runtime
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true

# Utilities
uuid.workspace = true

# Math (for CameraParams construction)
glam.workspace = true

# Base64 encoding (for INP puppet data transfer)
base64.workspace = true

[features]
default = []
onnx = ["neko-native-core/onnx"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
