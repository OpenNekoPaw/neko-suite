[package]
name = "neko-native-puppet"
version.workspace = true
edition.workspace = true
description = "2D puppet management with ECS for Neko Engine (Inochi2D/inox2d)"
license.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
# ECS framework (standalone, not full Bevy — mirrors native-scene)
bevy_ecs = "0.15"

# Math library
glam = { version = "0.29", features = ["serde"] }

# Inochi2D puppet format parser (BSD 2-Clause)
inox2d = { git = "https://github.com/Inochi2D/inox2d" }

# Shared types (EasingType, etc.)
neko-types = { path = "../types" }

# UUID for keyframe IDs
uuid = { workspace = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Error handling
thiserror = "1.0"

# Base64 encoding for texture data
base64 = "0.22"

[dev-dependencies]
