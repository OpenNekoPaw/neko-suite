[package]
name = "neko-runtime-puppet"
version.workspace = true
edition.workspace = true
description = "2D puppet management with ECS for Neko Engine"
license.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
# ECS framework (standalone, not full Bevy — mirrors runtime-scene)
bevy_ecs = "0.15"
bevy_tasks = "0.15"

# Math library
glam = { version = "0.29", features = ["serde"] }

# Shared types (EasingType, etc.)
neko-engine-types = { path = "../engine-types" }

# UUID for keyframe IDs
uuid = { workspace = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Error handling
thiserror = "1.0"

# Base64 encoding for texture data
base64 = "0.22"

[dev-dependencies]
