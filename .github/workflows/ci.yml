name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

# ──────────────────────────────────────────────
# Reusable setup anchors (YAML anchors not supported in GHA,
# so we use a composite pattern with shared steps)
# ──────────────────────────────────────────────

jobs:
  # ── Path change detection ──────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ts:
              - 'packages/**/src/**/*.{ts,tsx}'
              - 'packages/**/package.json'
              - 'pnpm-lock.yaml'
            rust:
              - 'packages/neko-engine/**'
            proto:
              - 'packages/neko-proto/**'

  # ── TypeScript: Build & Lint ───────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/neko-engine

      - name: Install FFmpeg dev libraries
        run: sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libva-dev pkg-config

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build

  # ── TypeScript: Tests ──────────────────────
  test-ts:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --run --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: packages/**/coverage/
          retention-days: 14

  # ── Rust: Format, Lint & Test ──────────────
  test-rust:
    name: Rust Tests
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    env:
      ORT_VERSION: "1.20.1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/neko-engine

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-ffmpeg-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: homebrew-ffmpeg-${{ runner.os }}-

      - name: Install FFmpeg (macOS)
        run: brew install ffmpeg pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: packages/neko-engine

      - name: Clippy lint
        run: cargo clippy --workspace -- -D warnings
        working-directory: packages/neko-engine

      - name: Clippy lint (onnx feature)
        run: cargo clippy --package neko-native-core --features onnx -- -D warnings
        working-directory: packages/neko-engine

      - name: Run tests
        run: cargo test --workspace
        working-directory: packages/neko-engine

      - name: Run tests (onnx feature)
        # Runs the 10 always-on ML tests (register/list/evict_idle_empty etc.)
        # that compile onnx-gated code but require no ORT dylib at runtime.
        run: cargo test --package neko-native-core --features onnx
        working-directory: packages/neko-engine

      # ── ONNX Runtime dylib — session + eviction timing tests ──────────
      # Downloads the pre-built ORT dylib from GitHub Releases so that
      # the #[ignore] timing tests (which create real ort::Session objects
      # from an embedded minimal ONNX model) can run.
      # E2E inference tests (upscale / denoise / clip / whisper) remain
      # #[ignore] because they require large model files not present in CI.
      - name: Download ONNX Runtime dylib (macOS)
        run: |
          ARCH=$(uname -m)   # arm64 or x86_64
          curl -fsSL \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-${ARCH}-${ORT_VERSION}.tgz" \
            -o /tmp/ort.tgz
          tar xzf /tmp/ort.tgz -C /tmp
          DYLIB=$(find "/tmp/onnxruntime-osx-${ARCH}-${ORT_VERSION}/lib" \
                       -name "libonnxruntime.*.dylib" | head -1)
          echo "ORT_DYLIB_PATH=${DYLIB}" >> "$GITHUB_ENV"

      - name: Run ONNX session + eviction timing tests
        # --include-ignored to run the three #[ignore] evict_idle timing
        # tests that need a live ORT session (stale / fresh / mixed).
        run: |
          cargo test --package neko-native-core --features onnx \
            -- ml::tests::test_evict_idle --include-ignored
        working-directory: packages/neko-engine

  # ── Rust: Dependency audit ─────────────────
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: packages/neko-engine/Cargo.toml

  # ── Proto: Type generation check ───────────
  proto-check:
    name: Proto Types Sync
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Regenerate proto types
        run: pnpm generate:types
      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet packages/neko-types/src/generated/; then
            echo "::error::Generated proto types are out of sync. Run 'pnpm generate:types' and commit."
            git diff packages/neko-types/src/generated/
            exit 1
          fi

  # ── Code Quality: Unused code & architecture ─
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Knip — unused code detection
        run: pnpm check:unused

      - name: dependency-cruiser — architecture rules
        run: pnpm check:deps

  # ── Security: Dependency review (PR only) ──
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: on-failure

  # ── Release: Bundle ORT + Package VSIX ────
  # Runs on push to main only. Downloads ORT dylibs for all 4 platforms,
  # then packages neko-engine as a VSIX with dylibs bundled in bin/.
  package-vsix:
    name: Package VSIX (with ORT)
    runs-on: macos-latest
    needs: [build, test-ts, test-rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/neko-engine

      - name: Cache ORT dylibs
        uses: actions/cache@v4
        with:
          path: packages/neko-engine/bin
          key: ort-bin-${{ env.ORT_VERSION }}
        env:
          ORT_VERSION: "1.20.1"

      - name: Install FFmpeg (macOS)
        run: brew install ffmpeg pkg-config

      - run: pnpm install --frozen-lockfile

      - name: Build neko-engine extension
        run: pnpm build:neko-engine

      - name: Download ORT dylibs (all platforms)
        # vscode:prepublish already calls bundle:ort:all, but run explicitly
        # here so the cache step above can populate bin/ on cache miss.
        run: node scripts/download-ort.js --all
        working-directory: packages/neko-engine

      - name: Package VSIX
        run: npm run package
        working-directory: packages/neko-engine

      - uses: actions/upload-artifact@v4
        with:
          name: neko-engine-vsix
          path: packages/neko-engine/*.vsix
          retention-days: 30
