name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

# ──────────────────────────────────────────────
# Reusable setup anchors (YAML anchors not supported in GHA,
# so we use a composite pattern with shared steps)
# ──────────────────────────────────────────────

jobs:
  # ── Path change detection ──────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(mktemp)"
          event_name="${{ github.event_name }}"

          if [[ "${event_name}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            git diff --name-only "${base_sha}" "${head_sha}" > "${changed_files}"
          else
            before_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"

            if [[ -z "${before_sha}" || "${before_sha}" =~ ^0+$ ]]; then
              if git rev-parse "${head_sha}^" >/dev/null 2>&1; then
                before_sha="$(git rev-parse "${head_sha}^")"
                git diff --name-only "${before_sha}" "${head_sha}" > "${changed_files}"
              else
                git ls-files > "${changed_files}"
              fi
            else
              git diff --name-only "${before_sha}" "${head_sha}" > "${changed_files}"
            fi
          fi

          ts=false
          rust=false
          proto=false

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue

            if [[ "${file}" =~ ^packages/.+/src/.+\.(ts|tsx)$ ]] || [[ "${file}" =~ ^packages/.+/package\.json$ ]] || [[ "${file}" == "pnpm-lock.yaml" ]]; then
              ts=true
            fi

            if [[ "${file}" == packages/neko-engine/* ]]; then
              rust=true
            fi

            if [[ "${file}" == packages/neko-proto/* ]]; then
              proto=true
            fi
          done < "${changed_files}"

          echo "ts=${ts}" >> "${GITHUB_OUTPUT}"
          echo "rust=${rust}" >> "${GITHUB_OUTPUT}"
          echo "proto=${proto}" >> "${GITHUB_OUTPUT}"

  # ── TypeScript: Build & Lint ───────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libclang-dev \
            libasound2-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libssl-dev \
            libswresample-dev \
            libswscale-dev \
            libudev-dev \
            libva-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config

      - run: pnpm build

  # ── TypeScript: Tests ──────────────────────
  test-ts:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --run --coverage

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-reports
          path: packages/**/coverage/
          retention-days: 14

  # ── Rust: Format, Lint & Test ──────────────
  test-rust:
    name: Rust Tests
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    env:
      ORT_VERSION: '1.20.1'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/neko-engine

      - name: Cache Homebrew packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-ffmpeg-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: homebrew-ffmpeg-${{ runner.os }}-

      - name: Install FFmpeg (macOS)
        run: brew install ffmpeg pkg-config

      # vendor/ is gitignored; remove the cargo config that forces vendored sources
      - name: Remove vendor source override
        run: rm -f packages/neko-engine/.cargo/config.toml

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: packages/neko-engine

      - name: Clippy lint
        run: cargo clippy --workspace -- -D warnings
        working-directory: packages/neko-engine

      - name: Clippy lint (onnx feature)
        run: cargo clippy --package neko-engine-kernel --features onnx -- -D warnings
        working-directory: packages/neko-engine

      - name: Run tests
        run: cargo test --workspace
        working-directory: packages/neko-engine

      - name: Run tests (onnx feature)
        # Runs the 10 always-on ML tests (register/list/evict_idle_empty etc.)
        # that compile onnx-gated code but require no ORT dylib at runtime.
        run: cargo test --package neko-engine-kernel --features onnx
        working-directory: packages/neko-engine

      # ── ONNX Runtime dylib — session + eviction timing tests ──────────
      # Downloads the pre-built ORT dylib from GitHub Releases so that
      # the #[ignore] timing tests (which create real ort::Session objects
      # from an embedded minimal ONNX model) can run.
      # E2E inference tests (upscale / denoise / clip / whisper) remain
      # #[ignore] because they require large model files not present in CI.
      - name: Download ONNX Runtime dylib (macOS)
        run: |
          ARCH=$(uname -m)   # arm64 or x86_64
          curl -fsSL \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-${ARCH}-${ORT_VERSION}.tgz" \
            -o /tmp/ort.tgz
          tar xzf /tmp/ort.tgz -C /tmp
          DYLIB=$(find "/tmp/onnxruntime-osx-${ARCH}-${ORT_VERSION}/lib" \
                       -name "libonnxruntime.*.dylib" | head -1)
          echo "ORT_DYLIB_PATH=${DYLIB}" >> "$GITHUB_ENV"

      - name: Run ONNX session + eviction timing tests
        # --include-ignored to run the three #[ignore] evict_idle timing
        # tests that need a live ORT session (stale / fresh / mixed).
        run: |
          cargo test --package neko-engine-kernel --features onnx \
            -- ml::tests::test_evict_idle --include-ignored
        working-directory: packages/neko-engine

  # ── Rust: Dependency audit ─────────────────
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      # vendor/ is gitignored; remove the cargo config that forces vendored sources
      - run: rm -f packages/neko-engine/.cargo/config.toml
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: packages/neko-engine/Cargo.toml

  # ── Proto: Type generation check ───────────
  proto-check:
    name: Proto Types Sync
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile
      - name: Regenerate proto types
        run: pnpm generate:types
      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet packages/neko-types/src/generated/; then
            echo "::error::Generated proto types are out of sync. Run 'pnpm generate:types' and commit."
            git diff packages/neko-types/src/generated/
            exit 1
          fi

  # ── Code Quality: Unused code & architecture ─
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Knip — unused code detection
        run: pnpm check:unused

      - name: dependency-cruiser — architecture rules
        run: pnpm check:deps

  # ── Security: Dependency review (PR only) ──
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: on-failure

  # ── Release: TS extensions VSIX packaging ────
  # Runs on push to main only. Packages all TS-only extensions.
  package-ts-vsix:
    name: Package TS Extensions VSIX
    runs-on: ubuntu-latest
    needs: [build, test-ts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Build TS extensions
        run: |
          pnpm turbo compile \
            --filter=neko-tools \
            --filter=neko-preview \
            --filter=neko-cut \
            --filter=neko-canvas \
            --filter=neko-agent \
            --filter=neko-story \
            --filter=neko-sketch \
            --filter=neko-puppet \
            --filter=neko-audio \
            --filter=neko-assets \
            --filter=neko-auth \
            --filter=neko-market

      - name: Package TS extensions
        run: |
          mkdir -p vsix-artifacts
          for pkg in neko-tools neko-preview neko-cut neko-canvas neko-agent \
                     neko-story neko-sketch neko-puppet neko-audio neko-assets \
                     neko-auth neko-market neko-suite; do
            if [ -d "packages/$pkg" ]; then
              echo "📦 Packaging $pkg..."
              (cd "packages/$pkg" && npx @vscode/vsce package --no-dependencies --allow-missing-repository) || true
              cp -f packages/$pkg/*.vsix vsix-artifacts/ 2>/dev/null || true
            fi
          done

      - uses: actions/upload-artifact@v6
        with:
          name: ts-extensions-vsix
          path: vsix-artifacts/*.vsix
          retention-days: 30

  # ── Release: Platform-specific neko-engine VSIX packaging ────
  # Runs on push to main only. Builds native addon + bundles ORT/FFmpeg
  # per platform, producing a platform-specific VSIX for each target.
  package-engine-vsix:
    name: Package neko-engine VSIX (${{ matrix.target }})
    needs: [build, test-ts, test-rust]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
            rust-target: aarch64-apple-darwin
            ffmpeg-install: brew install ffmpeg pkg-config
          - target: darwin-x64
            os: macos-13
            rust-target: x86_64-apple-darwin
            ffmpeg-install: brew install ffmpeg pkg-config
          - target: linux-x64
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            ffmpeg-install: sudo apt-get update && sudo apt-get install -y clang libclang-dev libasound2-dev libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libssl-dev libswresample-dev libswscale-dev libudev-dev libva-dev libvulkan-dev libwayland-dev libx11-dev libxcursor-dev libxfixes-dev libxi-dev libxkbcommon-dev libxrandr-dev patchelf pkg-config
          - target: win32-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            ffmpeg-install: choco install ffmpeg-shared
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/neko-engine
          key: ${{ matrix.target }}

      - name: Install FFmpeg
        run: ${{ matrix.ffmpeg-install }}

      - run: pnpm install --frozen-lockfile

      # vendor/ is gitignored; remove the cargo config that forces vendored sources
      - name: Remove vendor source override
        run: rm -f packages/neko-engine/.cargo/config.toml
        shell: bash

      # Build the native .node for this platform
      - name: Build host-napi
        working-directory: packages/neko-engine/packages/host-napi
        run: pnpm run build:napi -- --target ${{ matrix.rust-target }}

      # Package platform-specific VSIX (handles ORT + FFmpeg bundling)
      - name: Package platform VSIX
        working-directory: packages/neko-engine
        run: bash scripts/package-platform.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v6
        with:
          name: neko-engine-vsix-${{ matrix.target }}
          path: packages/neko-engine/*.vsix
          retention-days: 30
